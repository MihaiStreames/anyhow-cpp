fail_fast: true

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        priority: 0
      - id: end-of-file-fixer
        priority: 0
      - id: mixed-line-ending
        args: [--fix=lf]
        priority: 0

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        priority: 0

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        priority: 0

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        types: [shell]
        priority: 0

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273  # frozen: v3.9.10
    hooks:
      - id: prettier
        types_or: [json, yaml]
        priority: 0

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: e2c2116d86a80e72e7146a06e68b7c228afc6319  # frozen: v0.6.13
    hooks:
      - id: cmake-format
        priority: 0

  - repo: local
    hooks:
      - id: clang-format
        name: format
        entry: clang-format -i
        language: system
        types_or: [c, c++]
        priority: 0

      - id: clang-tidy
        name: lint
        entry: clang-tidy --use-color -p build
        language: system
        files: \.cpp$
        priority: 1

      - id: ctest
        name: test
        entry: bash -c 'cmake --build build --target anyhow-tests && ctest --test-dir build --output-on-failure'
        language: system
        pass_filenames: false
        always_run: true
        priority: 2
